# Manual Meta diagnostics. Publishes NOTHING.
# Optional "container_test": creates one Instagram container that is never
# published (expires by itself within 24 h) to prove Meta can fetch our image.
name: Meta - diagnostic (aucune publication)
on:
  workflow_dispatch:
    inputs:
      container_test:
        description: "Créer un conteneur Instagram de test NON publié"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - env:
          PYTHONPATH: src
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: python -m comptoir.run meta-check ${{ inputs.container_test && '--container-test' || '' }}
