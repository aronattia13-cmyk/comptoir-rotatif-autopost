# ONE real test publication — only when David types the exact confirmation
# phrase. Independent from automatic publishing (still locked: no LIVE_ENABLED).
name: Meta - publication de TEST (manuelle)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Taper exactement : JE CONFIRME LA PUBLICATION DE TEST"
        required: true
      surface:
        description: "post ou story"
        type: choice
        options: [post, story]
        default: post
      uid:
        description: "Identifiant précis (optionnel, sinon le prochain élément planifié)"
        required: false
        default: ""
permissions:
  contents: write
concurrency: { group: comptoir-state, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: meta-publication      # optional extra approval gate in GitHub
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - env:
          PYTHONPATH: src
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          CONFIRM: ${{ inputs.confirm }}
          SURFACE: ${{ inputs.surface }}
          TARGET_UID: ${{ inputs.uid }}
        run: python -m comptoir.run publish-test --confirm "$CONFIRM" --surface "$SURFACE" --uid "$TARGET_UID"
      - if: always()
        run: |
          git config user.name "comptoir-bot"
          git config user.email "comptoir-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Publication de test $(date -u +%F)"
          git push
