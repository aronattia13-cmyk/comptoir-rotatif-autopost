# Redeploys GitHub Pages when visuals / dashboard / bio page change on main
# (e.g. after a rebuild). The weekly workflow also deploys on its own.
# Publishes nothing on Instagram or Facebook.
name: Mise en ligne GitHub Pages
on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - uses: actions/deploy-pages@v4
