# Contrôle indépendant des publications du jour, canal par canal :
# Story Instagram (09:30), Post Instagram et Post Facebook (16:30), heure de Paris.
# Chaque publication doit avoir un identifiant Meta (relu chez Meta) et, si disponible, un lien.
# Échec = exécution rouge + issue GitHub « publication manquée » (notification au propriétaire).
# Déclenché par le déclencheur externe (docs/declenchement-externe.md) et, en secours, par GitHub.
name: Contrôle des publications
on:
  schedule:
    - cron: "23 8,9,15,16 * * *"    # secours : ~10:20 et ~17:20 Paris (hiver et été)
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - env:
          PYTHONPATH: src
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_APP_ID: ${{ vars.META_APP_ID }}
        run: python -m comptoir.run check
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/alerte.sh
