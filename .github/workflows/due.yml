# Publications that are due, every 30 minutes, 7 days a week (+ external trigger, see docs/declenchement-externe.md).
#
# 1. refresh : compare live Shopify prices with every future product visual;
#              regenerate visual + captions when a price / lot / name changed.
# 2. deploy  : if a visual was regenerated, redeploy GitHub Pages first.
# 3. due     : publish what is due. Before sending, the price shown on the
#              visual and the exact bytes served by GitHub Pages (SHA-256)
#              are checked: an outdated image is never sent to Meta.
#
# Mode is decided by the repository itself:
#   - config/LIVE_ENABLED absent  -> TEST (nothing published)
#   - config/LIVE_ENABLED present -> real publication
name: Publications du jour
on:
  schedule:
    - cron: "7,37 6-17 * * *"       # UTC, 7 j/7 ; couvre 09:30 et 16:30 Europe/Paris, hiver et été (+ déclenchement externe, voir docs/declenchement-externe.md)
  workflow_dispatch:
concurrency: { group: comptoir-state, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      site_changed: ${{ steps.refresh.outputs.site_changed }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: sudo apt-get install -y --no-install-recommends libfribidi0   # kerning (raqm)
      - run: pip install -r requirements.txt
      - id: refresh
        env:
          PYTHONPATH: src
          WHATSAPP_NUMBER: ${{ secrets.WHATSAPP_NUMBER }}
        run: python -m comptoir.run refresh
      - run: |
          git config user.name "comptoir-bot"
          git config user.email "comptoir-bot@users.noreply.github.com"
          git add data site
          git diff --cached --quiet || git commit -m "Visuels actualisés (prix Shopify) $(date -u +%F-%H%M)"
          git pull --rebase -q && git push

  deploy:
    needs: refresh
    if: needs.refresh.outputs.site_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - uses: actions/deploy-pages@v4

  due:
    needs: [refresh, deploy]
    if: ${{ always() && needs.refresh.result == 'success' && needs.deploy.result != 'failure' && needs.deploy.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - env:
          PYTHONPATH: src
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_APP_ID: ${{ vars.META_APP_ID }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: python -m comptoir.run due --mode auto
      - name: Contrôle par canal (Story IG, Post IG, Post FB)
        id: check
        if: always()
        env:
          PYTHONPATH: src
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_APP_ID: ${{ vars.META_APP_ID }}
        run: python -m comptoir.run check
      - name: Alerte (issue GitHub + e-mail)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/alerte.sh
      - if: always()
        run: |
          git config user.name "comptoir-bot"
          git config user.email "comptoir-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Suivi publications $(date -u +%F-%H%M)"
          git pull --rebase -q && git push
