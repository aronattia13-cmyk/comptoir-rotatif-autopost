# Automated test suite on every push / pull request. No secrets, no network
# calls to Meta (Meta is fully mocked in tests).
name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get install -y --no-install-recommends libfribidi0   # kerning (raqm)
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
